name: Backend Validation

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  backend-core:
    name: Core Backend Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local API for auth/security
        env:
          API_PORT: 3003
          PORT: 3003
          AUTH_PROVIDER: local
          AUTH_EXPOSE_RESET_CODE: "true"
          AUTH_REQUIRE_EMAIL_DELIVERY: "false"
          AUTH_SECURITY_STATUS_ENABLED: "true"
        run: |
          nohup node local-api-server.js > backend-core-api.log 2>&1 &

      - name: Wait for API health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3003/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy in time"
          cat backend-core-api.log || true
          exit 1

      - name: Start strict-mode API for the delivery check
        env:
          API_PORT: 3004
          PORT: 3004
          AUTH_PROVIDER: local
          AUTH_EXPOSE_RESET_CODE: "true"
          # Al reves que la otra API a proposito: el test estricto existe para
          # comprobar que con la entrega exigida no hay codigo local de reserva.
          AUTH_REQUIRE_EMAIL_DELIVERY: "true"
          AUTH_SECURITY_STATUS_ENABLED: "true"
        run: |
          nohup node local-api-server.js > backend-strict-api.log 2>&1 &

      - name: Wait for strict API health
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3004/api/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Strict API did not become healthy in time"
          cat backend-strict-api.log || true
          exit 1

      - name: Run backend CI checks
        env:
          STRICT_API_BASE_URL: http://127.0.0.1:3004
          # El test estricto mira su propio entorno para saber como esta
          # configurada la API que va a probar.
          AUTH_EXPOSE_RESET_CODE: "true"
          AUTH_REQUIRE_EMAIL_DELIVERY: "true"
          API_BASE_URL: http://127.0.0.1:3003
          RUN_MOBILITY_BACKEND_TESTS: "false"
        run: npm run test:backend-ci

      # Las 1.690 pruebas de lib/ y las 934 del front no se corrian aqui: el
      # trabajo solo pasaba por test:backend-ci y por el build. O sea que toda
      # la red de seguridad del repositorio dependia de que alguien se acordara
      # de lanzarla a mano antes de empujar. Dos pasos, y ya no.
      #
      # Los ficheros se buscan con `find`, y las dos formas obvias estan
      # descartadas por un motivo medido cada una.
      #
      # `npm run test:lib` no sirve: ese script escribe `lib/**/*.test.js` sin
      # comillas. En Windows funciona porque cmd no expande y el patron llega
      # entero a node, pero aqui lo expande bash, y sin `globstar` eso se queda
      # en `lib/*/*.test.js`: fuera los 61 ficheros que estan directamente en
      # lib/. Medido, 934 de las 1.699 pruebas.
      #
      # Y entre comillas tampoco: node sabe expandir el patron el mismo, pero
      # **solo desde la version 22**. Este trabajo usa la 20 y contesto
      # `Could not find 'lib/**/*.test.js'`. En local paso, porque ahi hay una
      # Node 24; lo cazo el CI en el primer empujon, que es para lo que esta.
      #
      # `find` no depende ni de la shell ni de la version de node.
      # El lint de lo que corre en el servidor, y va ANTES de las pruebas.
      #
      # `lib/` y `api/` son 46.514 lineas que nunca se lintaron: el `eslintConfig`
      # del package.json extiende `react-app`, que CRA solo aplica a `src/`. La
      # primera vez que se les paso `no-undef` salieron cinco identificadores
      # inexistentes, y dos estaban en caminos de error: un `registra()` sin
      # importar en el manejador de OG y un `remitente()` sin importar en el aviso
      # de WhatsApp. Los dos levantaban un ReferenceError justo cuando algo ya iba
      # mal, que es por eso que nadie los vio en meses.
      #
      # Va antes de las pruebas porque es mas rapido y porque un identificador que
      # no existe no lo caza ninguna prueba que lea el fuente —eso tambien se
      # aprendio aqui: una prueba mia buscaba el texto `hasPostgresConnection()`
      # y lo encontraba, mientras esa funcion no existia en ese fichero—.
      - name: Lint server code
        run: npm run lint:servidor

      # El trinquete del esquema. Cuenta cuantos ficheros crean tablas o anaden
      # columnas dentro de una peticion, en los dos repositorios, y falla si suben.
      #
      # Existia y no estaba en ningun CI: llevaba nueve dias en rojo sin que nadie lo
      # supiera —el ERP gano ficheros con DDL el 23 y el 24 de septiembre, los topes se
      # escribieron el 22—. Un trinquete que nadie ejecuta no es un trinquete.
      #
      # Necesita el repositorio del ERP al lado para contar su mitad; si no esta, lo
      # dice y cuenta solo la de aqui, asi que en el CI no falla por eso.
      - name: Schema ratchet
        run: npm run test:migraciones

      - name: Run lib tests
        run: node --test $(find lib -name '*.test.js')

      - name: Run frontend tests
        env:
          CI: "true"
        run: npx react-scripts test --watchAll=false

      - name: Build app
        env:
          CI: "true"
        run: npm run build

      - name: Upload API log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-core-api-log
          path: backend-core-api.log
